name: Dynamic Multi-Target Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse deploy.json
        id: config
        run: |
          if [ -f "deploy.json" ]; then
            TARGET=$(jq -r '.target // "cloudflare"' deploy.json)
            PROJECT_NAME=$(jq -r '.project_name // empty' deploy.json)
            DOMAIN=$(jq -r '.domain // empty' deploy.json)
            OUTPUT_DIR=$(jq -r '.output_dir // "dist"' deploy.json)
          else
            TARGET="cloudflare"
            PROJECT_NAME=""
            DOMAIN=""
            OUTPUT_DIR="dist"
          fi
          
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Target detected: $TARGET"
          echo "Project Name: $PROJECT_NAME"
          echo "Domain: $DOMAIN"
          echo "Output Dir: $OUTPUT_DIR"

      # -----------------------------------------------------------
      # 1. DEPLOY TO CLOUDFLARE PAGES
      # -----------------------------------------------------------
      - name: Build & Deploy to Cloudflare Pages
        if: steps.config.outputs.target == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          DOMAIN: ${{ steps.config.outputs.domain }}
          OUTPUT_DIR: ${{ steps.config.outputs.output_dir }}
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            npm run build || true
          fi
          
          DEPLOY_DIR="$OUTPUT_DIR"
          if [ ! -d "$DEPLOY_DIR" ]; then
            if [ -d "dist" ]; then
              DEPLOY_DIR="dist"
            elif [ -d "build" ]; then
              DEPLOY_DIR="build"
            else
              mkdir -p dist
              cp -r public/* dist/ 2>/dev/null || true
              cp index.html dist/ 2>/dev/null || true
              DEPLOY_DIR="dist"
            fi
          fi
          
          echo "Deploying directory: $DEPLOY_DIR"
          npx wrangler pages project create "$PROJECT_NAME" --production-branch=main || true
          npx wrangler pages deploy "$DEPLOY_DIR" --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
          
          if [ -n "$DOMAIN" ]; then
            echo "Attaching custom domain: $DOMAIN"
            npx wrangler pages project domain create "$DOMAIN" --project-name="$PROJECT_NAME" || true
          fi

      # -----------------------------------------------------------
      # 2. DEPLOY TO VERCEL
      # -----------------------------------------------------------
      - name: Build & Deploy to Vercel
        if: steps.config.outputs.target == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DOMAIN: ${{ steps.config.outputs.domain }}
        run: |
          npm install -g vercel
          vercel deploy --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
          
          if [ -n "$DOMAIN" ]; then
            echo "Attaching custom domain to Vercel: $DOMAIN"
            vercel domains add "$DOMAIN" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" || true
          fi

      # -----------------------------------------------------------
      # 3. DEPLOY TO VPS (COOLIFY)
      # -----------------------------------------------------------
      - name: Trigger Coolify Webhook
        if: steps.config.outputs.target == 'vps'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Triggering Coolify deployment..."
            curl -X POST "$COOLIFY_WEBHOOK_URL"
          else
            echo "No COOLIFY_WEBHOOK_URL secret set. Skipping."
          fi
